<title>Дневник тренировок</title>
<style>
:root{--bg:#eef0fb;--card:#fff;--tx:#1d1b3a;--mu:#6a6d94;--ac:#5b5fd6;--bd:#d9dcf2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152b;--card:#1f2040;--tx:#ecedfb;--mu:#9a9dc9;--ac:#6c70e8;--bd:#32345e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14152b;--card:#1f2040;--tx:#ecedfb;--mu:#9a9dc9;--ac:#6c70e8;--bd:#32345e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;color:var(--ac)}
.hd{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.hd h1{margin:0}.lg{width:44px;height:44px;border-radius:10px;display:block;flex:none}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
nav button{font-size:14px;padding:10px 2px}
.row>div{flex:1;min-width:0}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-top:8px}
label{font-size:13px;color:var(--mu)}
.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 16px inherit;font-family:inherit}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:14px}
.hint{border-left:3px solid var(--ac);padding-left:10px;margin-top:10px;font-size:14px}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.set:first-of-type{border-top:0}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 10px}
.up{color:#2f9e44;font-weight:600}
[hidden]{display:none!important}

<nav><button data-t="log" class="on">Запись</button><button data-t="plan">Программа</button><button data-t="prog">Прогресс</button><button data-t="data">Данные</button></nav>

<section id="log">
  <div class="card">
    <label for="ex">Упражнение</label>
    <input id="ex" list="exl" placeholder="Например, жим лёжа" autocomplete="off">
    <datalist id="exl"></datalist>
    <div class="row">
      <div><label for="w">Вес, кг</label><input id="w" inputmode="decimal" placeholder="60"></div>
      <div><label for="n">Подходы</label><input id="n" inputmode="numeric" value="3"></div>
      <div><label for="r">Повторы</label><input id="r" inputmode="numeric" placeholder="8"></div>
    </div>
    <button class="btn" id="add">Добавить</button>
    <div id="hint" class="hint" hidden></div>
  </div>
  <div class="card"><b>Сегодня</b><div id="today"></div></div>
</section>

<section id="plan" hidden>
  <div class="card">
    <label for="pt">Моя программа тренировок</label>
    <textarea id="pt" rows="16" style="margin-top:6px" placeholder="День 1 — грудь, трицепс&#10;Жим лёжа 4×8&#10;Разводка гантелей 3×12&#10;&#10;День 2 — спина, бицепс&#10;..."></textarea>
    <p id="ps" class="mu">Сохраняется автоматически.</p>
  </div>
</section>

<section id="prog" hidden>
  <div class="card">
    <label for="pe">Дата тренировки</label><select id="pe"></select>
    <div id="sum" class="mu" style="margin-top:8px"></div>
  </div>
  <div class="card"><b>Что делал в этот день</b><div id="hist"></div></div>
</section>

<section id="data" hidden>
  <div class="card">
    <p class="mu" style="margin-top:0">Данные хранятся только в этом браузере. Сделай копию, чтобы не потерять их.</p>
    <textarea id="box" rows="6"></textarea>
    <button class="btn" id="exp">Показать копию данных</button>
    <button class="btn g" id="imp">Загрузить из копии</button>
    <button class="btn g" id="clr">Удалить записи тренировок</button>
    <p id="msg" class="mu"></p>
  </div>
</section>
</main>
<script>
const K='gym-v1';let S={logs:[]};
try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.logs))S=s}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>d.slice(8)+'.'+d.slice(5,7);
const e1=(w,r)=>w*(1+r/30);
const num=v=>parseFloat(String(v).replace(',','.'));
const exs=()=>[...new Set(S.logs.map(l=>l.ex))].sort();
const byEx=ex=>S.logs.filter(l=>l.ex.toLowerCase()===ex.toLowerCase());
function sessions(ex){const m={};byEx(ex).forEach(l=>(m[l.d]=m[l.d]||[]).push(l));
  return Object.keys(m).sort().map(d=>({d,sets:m[d],v:Math.max(...m[d].map(s=>e1(s.w,s.r)))}))}

function tab(t){['log','plan','prog','data'].forEach(x=>$(x).hidden=x!==t);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='prog')renderProg()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

function grp(t){const o=[];t.forEach(l=>{const p=o[o.length-1];if(p&&p.ex===l.ex&&p.w===l.w&&p.r===l.r){p.c++;p.id=l.id}else o.push({ex:l.ex,w:l.w,r:l.r,c:1,id:l.id})});return o}
function renderLog(){
  $('exl').innerHTML=exs().map(e=>`<option value="${esc(e)}">`).join('');
  const t=S.logs.filter(l=>l.d===today());
  $('today').innerHTML=t.length?grp(t).map(l=>`<div class="set"><span>${esc(l.ex)} — <b>${l.w} кг × ${l.r}</b>${l.c>1?' · '+l.c+' подх.':''}</span><button class="x" data-id="${l.id}" aria-label="Удалить один подход">✕</button></div>`).join(''):'<p class="mu">Пока нет подходов.</p>';
  $('today').querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.logs=S.logs.filter(l=>l.id!==+b.dataset.id);save();renderLog();showHint()});
}
function showHint(){
  const ex=$('ex').value.trim(),h=$('hint');
  if(!ex){h.hidden=true;return}
  const prev=sessions(ex).filter(s=>s.d<today()).pop();
  if(!prev){h.hidden=true;return}
  const best=prev.sets.reduce((a,b)=>e1(b.w,b.r)>e1(a.w,a.r)?b:a);
  const idea=best.r>=12?`${best.w+2.5} × 8 (добавь вес)`:`${best.w} × ${best.r+1} (на повтор больше)`;
  h.hidden=false;
  h.innerHTML=`В прошлый раз (${fmt(prev.d)}): ${prev.sets.map(s=>s.w+'×'+s.r).join(', ')}.<br>Идея на сегодня: <b>${idea}</b>`;
}
$('ex').oninput=showHint;
$('add').onclick=()=>{
  const ex=$('ex').value.trim(),w=num($('w').value),r=parseInt($('r').value,10);
  if(!ex||!(w>=0)||!(r>0)){alert('Заполни упражнение, вес и повторы');return}
  const known=exs().find(e=>e.toLowerCase()===ex.toLowerCase())||ex;
  const n=Math.min(Math.max(parseInt($('n').value,10)||1,1),20),id0=Date.now();for(let i=0;i<n;i++)S.logs.push({id:id0+i,d:today(),ex:known,w,r});save();
  $('r').value='';renderLog();showHint();
};

const cs=a=>{const o=[];a.forEach(x=>{const p=o[o.length-1];p&&p.w===x.w&&p.r===x.r?p.c++:o.push({w:x.w,r:x.r,c:1})});return o.map(p=>p.c+' × '+p.r+' по '+p.w+' кг').join(', ')};
function renderProg(){
  const days=[...new Set(S.logs.map(l=>l.d))].sort().reverse(),sel=$('pe'),cur=sel.value;
  sel.innerHTML=days.map(d=>`<option value="${d}" ${d===cur?'selected':''}>${fmt(d)}.${d.slice(0,4)}${d===today()?' (сегодня)':''}</option>`).join('');
  if(!days.length){$('sum').textContent='';$('hist').innerHTML='<p class="mu">Добавь первый подход на вкладке «Запись».</p>';return}
  const d=sel.value,dl=S.logs.filter(l=>l.d===d),names=[...new Set(dl.map(l=>l.ex))];
  $('sum').textContent='Упражнений: '+names.length+' · подходов: '+dl.length;
  $('hist').innerHTML=names.map(ex=>{
    const sets=dl.filter(l=>l.ex===ex),top=Math.max(...sets.map(s=>e1(s.w,s.r)));
    const pv=sessions(ex).filter(s=>s.d<d).pop();
    const cmp=pv?`<div class="mu">Прошлый раз (${fmt(pv.d)}): ${cs(pv.sets)} ${top>pv.v+0.05?'<span class="up">↑ лучше</span>':''}</div>`:'<div class="mu">Первый раз в дневнике</div>';
    return `<div class="set" style="display:block"><b>${esc(ex)}</b><div>${cs(sets)}</div>${cmp}</div>`}).join('');
}
$('pe').onchange=renderProg;

$('pt').value=S.plan||'';
$('pt').oninput=()=>{S.plan=$('pt').value;save();$('ps').textContent='Сохранено ✓'};

$('exp').onclick=()=>{$('box').value=JSON.stringify(S);$('box').select();$('msg').textContent='Скопируй этот текст и сохрани, например, в заметках.'};
$('imp').onclick=()=>{try{const s=JSON.parse($('box').value);if(!Array.isArray(s.logs))throw 0;S=s;save();renderLog();$('pt').value=S.plan||'';$('msg').textContent='Данные загружены.'}catch(e){$('msg').textContent='Не получилось прочитать копию.'}};
$('clr').onclick=()=>{if(confirm('Удалить все записи?')){S={logs:[],plan:S.plan};save();renderLog();$('box').value='';$('msg').textContent='Записи удалены, программа осталась.'}};
renderLog();
</script></body></html>
